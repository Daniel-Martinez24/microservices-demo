name: Deploy Infrastructure and Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 1. ESTO ES CRÍTICO PARA OIDC: Permite a GitHub Actions solicitar un token a GCP sin usar contraseñas
permissions:
  contents: 'read'
  id-token: 'write'

env:
  # Map GitHub Secret/Variable to the required Terraform variable
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

jobs:
  deploy:
    name: Provision & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. AUTENTICACIÓN ENTERPRISE (OIDC)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # AQUI DEBES REEMPLAZAR (Ver explicación abajo)
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve

      # 3. Excelente uso de variables dinámicas (Mantenemos tu lógica)
      - name: Extract Terraform Outputs
        id: tf_outputs
        working-directory: ./terraform
        run: |
          echo "CLUSTER_NAME=$(terraform output -raw cluster_name)" >> $GITHUB_ENV
          echo "CLUSTER_LOCATION=$(terraform output -raw cluster_location)" >> $GITHUB_ENV

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}

      # 4. NUEVO PASO: Desplegar Observabilidad de forma separada
      - name: Deploy Prometheus Stack via Helm
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace

      # 5. Desplegar Online Boutique (Mantenemos tu ruta original)
      - name: Deploy Online Boutique Kubernetes Manifests
        working-directory: .
        run: |
          echo "Deploying the microservices to GKE..."
          kubectl apply -f ./release/kubernetes-manifests.yaml

      - name: Verify Deployment Status
        run: |
          echo "Waiting for pods to be ready..."
          kubectl wait --for=condition=ready pod --all --namespace=default --timeout=300s
          kubectl get pods -A